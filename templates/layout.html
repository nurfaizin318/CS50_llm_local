<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Local LLM{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .chat-container {
            display: flex;
            height: calc(100vh - 4rem);
        }
        
        .history-panel {
            width: 280px;
            border-right: 1px solid #e5e7eb;
            overflow-y: auto;
            transition: all 0.3s ease;
        }
        
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .message {
            max-width: 85%;
            padding: 1rem 1.25rem;
            border-radius: 0.75rem;
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .user-message {
            background-color: #3b82f6;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 0.25rem;
        }
        
        .bot-message {
            background-color: #f9fafb;
            color: #1f2937;
            border-bottom-left-radius: 0.25rem;
        }
        
        .input-container {
            padding: 1.5rem;
            border-top: 1px solid #e5e7eb;
            background-color: white;
        }
        
        .input-box {
            display: flex;
            gap: 1rem;
        }
        
        .message-input {
            flex: 1;
            min-height: 56px;
            max-height: 200px;
            resize: none;
            border: 1px solid #d1d5db;
            border-radius: 0.75rem;
            padding: 1rem;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }
        
        .message-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .send-button {
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 0.75rem;
            padding: 0 1.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 80px;
        }
        
        .send-button:hover {
            background-color: #2563eb;
        }
        
        .send-button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }
        
        .history-item {
            padding: 1rem;
            border-bottom: 1px solid #e5e7eb;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .history-item:hover {
            background-color: #f9fafb;
        }
        
        .history-item.active {
            background-color: #3b82f6;
            color: white;
        }
        
        .new-chat-btn {
            width: 100%;
            padding: 1rem;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .new-chat-btn:hover {
            background-color: #2563eb;
        }
        
        @media (max-width: 768px) {
            .chat-container {
                flex-direction: column;
            }
            
            .history-panel {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid #e5e7eb;
            }
            
            .history-toggle {
                display: block;
                width: 100%;
                padding: 1rem;
                background-color: #f9fafb;
                border: none;
                text-align: left;
                font-weight: 600;
                cursor: pointer;
                border-bottom: 1px solid #e5e7eb;
            }
            
            .history-content {
                max-height: 300px;
                overflow-y: auto;
            }
        }
    </style>
</head>

<body class="">

    {% block content %}{% endblock %}

</body>

</html>
